            <a

                <a href="certificates.html">

    <!-- =========================================
         MINIMAL SCROLL TO ABOUT
         ========================================= -->

    <script>

        let scrolling = false;

        window.addEventListener(
            "wheel",
            function (event) {

                if (event.deltaY > 0 && !scrolling) {

                    scrolling = true;

                    window.location.href = "about.html";

                }

            },
            { passive: true }
        );

    </script>
